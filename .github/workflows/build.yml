      - name: Build KeychainNuke app
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Compile binary
          clang \
            -arch arm64 \
            -isysroot "$SDK" \
            -framework Foundation \
            -framework Security \
            -framework UIKit \
            -miphoneos-version-min=14.0 \
            -o KeychainNuke \
            main.m
          
          # Buat struktur .app
          mkdir -p Payload/KeychainNuke.app
          cp KeychainNuke Payload/KeychainNuke.app/
          cp Info.plist Payload/KeychainNuke.app/
          
          # Pack thành IPA
          zip -r KeychainNuke.ipa Payload/
          ls -lh KeychainNuke.ipa

      - name: Upload KeychainNuke IPA
        uses: actions/upload-artifact@v4.4.0
        with:
          name: KeychainNuke-IPA
          path: KeychainNuke.ipa
          retention-days: 7
