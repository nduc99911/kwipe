name: Build iOS Dylibs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build dylibs
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          clang -arch arm64 \
            -isysroot "$SDK" \
            -framework Foundation \
            -framework Security \
            -dynamiclib \
            -o KeychainWipe.dylib \
            KeychainWipe.m
          
          clang -arch arm64 \
            -isysroot "$SDK" \
            -framework Foundation \
            -framework StoreKit \
            -dynamiclib \
            -o FakeSKPayment.dylib \
            FakeSKPayment.m

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: All-Dylibs
          path: |
            KeychainWipe.dylib
            FakeSKPayment.dylib
